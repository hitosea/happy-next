[package]
name = "app"
version = "2.0.0"
description = "Happy Next desktop client"
authors = ["Hitosea"]
license = "MIT"
repository = "https://github.com/hitosea/happy-next"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
log = "0.4"
notify-rust = "=4.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.9.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.9.0"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.1"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.1", default-features = false, features = ["NSAnimation", "NSAnimationContext", "NSAppearance", "NSApplication", "NSButton", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.1", default-features = false, features = ["NSArray", "NSData", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-user-notifications = { version = "=0.3.1", default-features = false, features = ["block2", "UNNotification", "UNNotificationRequest", "UNNotificationResponse", "UNUserNotificationCenter"] }
objc2-web-kit = { version = "=0.3.1", default-features = false, features = ["WKWebView"] }
tauri-plugin-notifications = { version = "=0.4.6", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
